[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offpsl"
version = "0.1.0"
description = "Conservative Pareto set amortization from offline arrays"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ji Cheng", email = "jicheng9617@gmail.com"}]
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
demo = ["matplotlib>=3.7,<4"]

[project.scripts]
offpsl = "offpsl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
